name: Update Naver Land listings

# 네이버는 클라우드/데이터센터 IP에서 land.naver.com 계열 접속을 끊어버린다.
# (GitHub 호스팅 러너로 실행하면 fin.land.naver.com 접속 자체가 45초 타임아웃 → 3회 재시도 후 실패)
# 그래서 이 워크플로는 국내 가정용 회선에 연결된 self-hosted 러너에서만 동작한다.
# 러너 설치 방법은 README의 "네이버 부동산 수집 러너" 항목 참고.
on:
  schedule:
    - cron: "0 17 * * *" # 매일 UTC 17:00 = KST 익일 02:00 (서울 전체 수집)
  workflow_dispatch:
    inputs:
      scope:
        description: "수집 범위"
        type: choice
        required: true
        default: gangnam
        options:
          - gangnam # 강남구만 (1~2분)
          - seoul # 서울 전체 구 + 정밀 동
          - probe # 타일 1개만 조회해 응답 원본을 로그에 출력(파일은 그대로)

permissions:
  contents: write

concurrency:
  group: naver-land
  cancel-in-progress: false

jobs:
  update-naver-land:
    # 집 회선에 붙은 러너에서 실행 (라벨은 러너 등록 시 지정한 값과 맞춰야 함)
    runs-on: [self-hosted, naver-scraper]
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    defaults:
      run:
        # 윈도우 러너에서 shell 선택 시 주의점:
        #  - bash : Git for Windows가 bash.exe를 bin 폴더에 두는데 PATH에는 cmd 폴더만
        #           들어가므로 "bash: command not found"로 실패한다.
        #  - powershell : 기본 실행 정책이 Restricted면 스텝 스크립트(.ps1) 실행이
        #           PSSecurityException(UnauthorizedAccess)로 차단된다.
        # cmd는 실행 정책의 영향을 받지 않고 항상 존재하므로 cmd를 사용한다.
        shell: cmd
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          call npm install --no-save playwright
          if errorlevel 1 exit /b 1
          call npx playwright install chromium
          if errorlevel 1 exit /b 1
      - name: Fetch Naver Land listings
        # 스케줄 실행은 서울 전체, 수동 실행은 선택한 범위(기본 강남구만).
        # 일부 지역만 수집해도 나머지 지역 데이터는 스크립트가 병합해 보존한다.
        env:
          NAVER_SCOPE: ${{ github.event.inputs.scope || 'seoul' }}
        run: node scripts/fetch-naver-land.js
      - name: Commit updated data
        id: commit
        # git diff --cached --quiet 는 변경이 있을 때 1을 반환한다(= errorlevel 1).
        # if 블록 안의 괄호가 커밋 메시지와 얽히지 않도록 goto로 분기한다.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rem 두 파일을 한 줄에 add하면 하나라도 없을 때 전체가 실패해 아무것도 스테이징되지 않는다.
          git add data/naver-land.json
          git add data/naver-land-history.json
          git diff --cached --quiet
          if errorlevel 1 goto commit
          echo no changes
          echo changed=false>>%GITHUB_OUTPUT%
          exit /b 0
          :commit
          git commit -m "chore: 네이버 부동산 매물 갱신 - %NAVER_SCOPE%"
          if errorlevel 1 exit /b 1
          git pull --rebase origin main
          if errorlevel 1 exit /b 1
          git push
          if errorlevel 1 exit /b 1
          echo changed=true>>%GITHUB_OUTPUT%
          exit /b 0
        env:
          NAVER_SCOPE: ${{ github.event.inputs.scope || 'seoul' }}

  deploy:
    needs: update-naver-land
    if: needs.update-naver-land.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-pages.yml
    secrets: inherit
