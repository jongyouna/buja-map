name: Check Naver Land data freshness

# update-naver-land.yml은 self-hosted(naver-scraper) 러너에서만 도는데, 그 러너가
# 예약 시각에 꺼져 있으면 스케줄 실행이 조용히 큐에 대기하다 24시간 뒤 취소된다
# (docs/naver-land-runner.md). 이 워크플로는 그 상황을 잡아내는 별도 헬스체크로,
# 네이버 접속이 필요 없어 일반 GitHub 호스팅 러너에서 돈다.
# update-naver-land.yml에 job을 얹지 않고 별도 파일로 분리한 이유: schedule 트리거는
# 워크플로 안의 모든 job을 같이 깨우므로, 02시 수집과 다른 주기로 돌리려면 별도 워크플로가 필요하다.
on:
  schedule:
    - cron: "0 0 * * *" # 매일 UTC 00:00 = KST 09:00 (02시 수집 + 7시간 여유)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Check data freshness
        id: check
        run: node scripts/check-naver-land-freshness.js
      - name: Notify if stale
        if: steps.check.outputs.stale == 'true'
        env:
          SMTP_URL: ${{ secrets.SMTP_URL }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NOTIFY_SUBJECT: "[buja-map] 네이버 부동산 데이터 갱신 지연"
          NOTIFY_MESSAGE: ${{ steps.check.outputs.message }}
        run: |
          npm install --no-save nodemailer@9
          node scripts/notify-failure.js
